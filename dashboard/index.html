<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Clima e Praia de Maceió</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div tabindex="0" class="dashboard" aria-label="Container principal do dashboard">
        <aside tabindex="0" class="sidebar" aria-label="Barra lateral">
            <h2>Maceió Dashboard</h2>
            <nav aria-label="Menu de navegação">
                <ul>
                    <li><a href="#">Início</a></li>
                    <li><a href="#">Praias</a></li>
                    <li><a href="#">Alertas</a></li>
                </ul>
            </nav>
        </aside>
        <div class="main-wrapper">
            <header tabindex="0" class="header" aria-label="Cabeçalho do dashboard">
                <h1>Clima e Praia de Maceió</h1>
            </header>
            <main tabindex="0" class="content" aria-label="Conteúdo principal do dashboard">
                <section class="cards-grid" aria-label="Grade de informações climáticas">
                    <div tabindex="0" class="card" aria-label="Card de Temperatura">
                        <h3>Temperatura</h3>
                        <p>28°C</p>
                    </div>
                    <div tabindex="0" class="card" aria-label="Card de Índice UV">
                        <h3>Índice UV</h3>
                        <p>Alto (8)</p>
                    </div>
                    <div tabindex="0" class="card" aria-label="Card de Qualidade da Água">
                        <h3>Qualidade da Água</h3>
                        <p>Própria</p>
                    </div>
                    <div tabindex="0" class="card" aria-label="Card de Marés">
                        <h3>Marés</h3>
                        <p>Baixa (0.3m)</p>
                    </div>
                    <div tabindex="0" class="card" aria-label="Card de Vento">
                        <h3>Vento</h3>
                        <p>15 km/h</p>
                    </div>
                    <div tabindex="0" class="card" aria-label="Card de Status das praias">
                        <h3>Status</h3>
                        <p>Abertas</p>
                    </div>
                </section>
                <section tabindex="0" class="chart-area" aria-label="Área de mapa e gráficos">
                    <h2>Mapa de Maceió</h2>
                    <div class="map-placeholder" aria-label="Visualização do mapa">
                        <p>[ Mapa ou Gráfico aqui ]</p>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>

</html>
