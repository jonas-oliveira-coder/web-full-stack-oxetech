<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atividades de Arrays</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-6 text-gray-800">

    <div class="max-w-xl mx-auto space-y-6">

        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">

            <h1 class="text-xl font-bold text-blue-600 mb-3">Atividade 1: Lista de Convidado</h1>
            <div class="flex gap-2 mb-6">
                <input type="text" id="nome-convidado" placeholder="Digite o nome"
                    class="flex-1 border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-blue-400">
                <button id="btn-adicionar"
                    class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700 transition">
                    Adicionar
                </button>
            </div>

            <hr class="my-6 border-gray-200">

            <h1 class="text-xl font-bold text-blue-600 mb-3">Atividade 2: Renderizando a lista</h1>
            <button id="btn-limpar"
                class="bg-red-500 text-white px-3 py-1 rounded mb-3 hover:bg-red-600 transition text-sm">Limpar
                Lista</button>
            <ul id="lista-convidados" class="list-disc pl-5 space-y-1 text-gray-700"></ul>

        </div>

        <div class="bg-white p-6 rounded-lg shadow-md border border-gray-200">

            <h1 class="text-xl font-bold text-green-600 mb-4">Atividade 3: Histórico de Feedbacks</h1>

            <form id="form-feedback" class="space-y-4 mb-6">
                <div>
                    <label for="nome-feedback" class="block font-medium text-gray-700 mb-1">Nome:</label>
                    <input type="text" id="nome-feedback" placeholder="Seu nome"
                        class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>

                <div>
                    <label for="mensagem-feedback" class="block font-medium text-gray-700 mb-1">Mensagem:</label>
                    <input type="text" id="mensagem-feedback" placeholder="Sua mensagem"
                        class="w-full border border-gray-300 rounded p-2 focus:outline-none focus:ring-2 focus:ring-green-400">
                </div>

                <button type="submit"
                    class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700 transition">
                    Enviar Feedback
                </button>
            </form>

            <div id="lista-feedbacks" class="space-y-3"></div>

        </div>

    </div>

    <script>
        // Atividade 1
        const inputConvidado = document.getElementById('nome-convidado');
        const btnAdicionar = document.getElementById('btn-adicionar');
        const convidados = [];

        btnAdicionar.addEventListener('click', function () {
            const nome = inputConvidado.value;

            if (nome === "") return;

            convidados.push(nome);
            console.log(convidados);
            inputConvidado.value = '';

            // Atividade 2
            const listaConvidados = document.getElementById('lista-convidados');
            listaConvidados.innerHTML = '';

            for (let i = 0; i < convidados.length; i++) {
                const li = document.createElement('li');
                li.innerHTML = convidados[i];
                listaConvidados.appendChild(li);
            }
        });

        const btnLimpar = document.getElementById('btn-limpar');
        btnLimpar.addEventListener('click', function () {
            convidados.length = 0;
            document.getElementById('lista-convidados').innerHTML = '';
        });

        // Atividade 3
        const formFeedback = document.getElementById('form-feedback');
        const inputNomeFeedback = document.getElementById('nome-feedback');
        const inputMensagemFeedback = document.getElementById('mensagem-feedback');
        const listaFeedbacks = document.getElementById('lista-feedbacks');
        const historico = [];

        formFeedback.addEventListener('submit', function (event) {
            event.preventDefault();

            const nome = inputNomeFeedback.value;
            const mensagem = inputMensagemFeedback.value;

            if (nome === "" || mensagem === "") return;

            historico.push({ nome: nome, mensagem: mensagem });
            formFeedback.reset();

            listaFeedbacks.innerHTML = '';

            for (let i = 0; i < historico.length; i++) {
                const div = document.createElement('div');
                div.className = "bg-gray-50 border border-gray-200 rounded p-3 text-gray-700";
                div.innerHTML = "<strong class='text-gray-900'>" + historico[i].nome + ":</strong> " + historico[i].mensagem;
                listaFeedbacks.appendChild(div);
            }
        });
    </script>
</body>

</html>
